name: Verify HackConnect
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: hackconnect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and API guards
        working-directory: backend
        run: python -m pytest tests/test_core.py tests/test_api.py tests/test_telegram.py -q
      - name: Initialize disposable database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -d hackconnect_test -v ON_ERROR_STOP=1 -f database/tests/bootstrap.sql
          psql -h localhost -U postgres -d hackconnect_test -v ON_ERROR_STOP=1 -f database/001_initial.sql
          psql -h localhost -U postgres -d hackconnect_test -v ON_ERROR_STOP=1 -f database/002_imported_student_roll_number.sql
          psql -h localhost -U postgres -d hackconnect_test -v ON_ERROR_STOP=1 -f database/003_telegram_feed.sql
      - name: Database journey, RLS, imports and concurrency
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/hackconnect_test
          TEST_NATIVE_POSTGRES: '1'
        run: python -m pytest tests/test_database_integration.py -q
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-only-public-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

